<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velonecy - Quadtree</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Velonecy - Bike station Quadtree</h1>
        <p>Pick a capacity: the maximum number of stations a cell can hold before it splits into 4.</p>
    </header>

    <main>
        <form method="get" action="{{ url_for('index') }}">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity"
                   min="{{ cmin }}" max="{{ cmax }}" value="{{ capacity }}" required>
            <button type="submit">Generate</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if image %}
            <section class="result">
                <p>Capacity <strong>{{ capacity }}</strong> &rarr; <strong>{{ n_nodes }}</strong> nodes</p>
                <img src="data:image/png;base64,{{ image }}" alt="Quadtree with capacity {{ capacity }}">
            </section>
        {% endif %}
    </main>
</body>
</html>
